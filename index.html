<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf3">
  <title>Hey Isabelle, Hey Tom – Die Hochzeitsmelodie</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(135deg, #fffdf9, #f8efe1);
      font-family: Georgia, "Times New Roman", serif; color: #5c421f;
      padding: 24px;
    }
    .card {
      width: min(720px, 100%); background: rgba(255,255,255,.9);
      border-radius: 24px; padding: 22px; text-align: center;
      box-shadow: 0 12px 40px rgba(80,55,20,.15);
    }
    img { width: 100%; max-width: 620px; border-radius: 16px; display: block; margin: 0 auto 22px; }
    h1 { margin: 0 0 8px; font-size: clamp(25px, 5vw, 40px); }
    p { margin: 0 0 18px; font-size: 18px; }
    audio { width: 100%; max-width: 620px; }
    .hint { margin-top: 16px; font-size: 14px; opacity: .75; }
  </style>
</head>
<body>
  <main class="card">
    <img src="cover.png" alt="Hey Isabelle, Hey Tom – Die Hochzeitsmelodie">
    <h1>Hey Isabelle, Hey Tom</h1>
    <p>Die Hochzeitsmelodie</p>
    <audio controls preload="metadata">
      <source src="hochzeit-isabelle-und-tom.mp3" type="audio/mpeg">
      Dein Browser unterstützt die Audiowiedergabe nicht.
    </audio>
    <div class="hint">Zum Abspielen einfach auf ▶ drücken.</div>
  </main>
</body>
</html>
